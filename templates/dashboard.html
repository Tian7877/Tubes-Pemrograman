<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.3/dist/tailwind.min.css">
    <script>
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        function showPosition(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            fetch(`/set_location?lat=${lat}&lon=${lon}`, {
                method: 'GET',
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    document.getElementById("location").innerText = `${data.city}, ${data.country}`;
                    document.getElementById("temperature").innerText = `${data.temperature}°C`;
                    document.getElementById("description").innerText = `Description: ${data.description}`;
                    document.getElementById("humidity").innerText = `Humidity: ${data.humidity}%`;
                    document.getElementById("windSpeed").innerText = `Wind Speed: ${data.windSpeed} m/s`;

                    const forecastContainer = document.getElementById("forecast-4hr");
                    forecastContainer.innerHTML = ''; // Clear previous forecasts
                    data.forecast.forEach(forecast => {
                        const forecastCard = document.createElement('div');
                        forecastCard.classList.add('p-4', 'bg-blue-100', 'rounded-lg', 'shadow-md', 'mb-4', 'w-40', 'items-center', 'transition-transform', 'duration-200', 'hover:scale-105');
                        forecastCard.innerHTML = `
                            <p class="text-lg font-semibold">${new Date(forecast.time).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</p>
                            <img src="http://openweathermap.org/img/wn/${forecast.icon}.png" alt="${forecast.description}" class="w-12 h-12">
                            <p class="text-lg">${forecast.temperature}°C</p>
                            <p class="text-sm text-gray-700">${forecast.description}</p>
                            <p class="text-sm text-gray-500">Humidity: ${forecast.humidity}%</p>
                        `;
                        forecastContainer.appendChild(forecastCard);
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Could not retrieve weather data.');
            });
        }

        function showError(error) {
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    alert("User denied the request for Geolocation.");
                    break;
                case error.POSITION_UNAVAILABLE:
                    alert("Location information is unavailable.");
                    break;
                case error.TIMEOUT:
                    alert("The request to get user location timed out.");
                    break;
                case error.UNKNOWN_ERROR:
                    alert("An unknown error occurred.");
                    break;
            }
        }

        window.onload = function() {
            getLocation();
        }
    </script>
</head>
<body class="bg-gradient-to-r from-blue-300 to-purple-500 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white shadow-2xl rounded-lg max-w-3xl w-full p-8">
        <!-- Header -->
        <h1 class="text-3xl font-bold text-center mb-4 text-gray-800">Welcome, {{ session['username'] }}!</h1>
        <p class="text-gray-500 text-center mb-8">Your current weather information</p>

        <!-- Main Weather Info -->
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-6 rounded-lg shadow-lg text-white mb-8">
            <div id="location" class="text-2xl font-semibold"></div>
            <div id="temperature" class="text-5xl font-bold my-2"></div>
            <div id="description" class="text-lg font-light mb-2"></div>
            <div class="flex space-x-4">
                <div id="humidity" class="text-gray-200 text-sm"></div>
                <div id="windSpeed" class="text-gray-200 text-sm"></div>
            </div>
        </div>

        <!-- 4-Hour Forecast -->
        <h2 class="text-xl font-semibold text-center mb-4 text-gray-800">4-Hour Forecast</h2>
        <div id="forecast-4hr" class="flex flex-wrap justify-center gap-4">
            <!-- JavaScript will dynamically populate forecast cards here -->
        </div>
        <div class="mt-8 text-center">
            <a href="/index" class="bg-blue-500 text-white py-2 px-6 rounded-full hover:bg-blue-600 transition duration-300">Next Pages</a>
        </div>
    </div>
</body>
</html>
