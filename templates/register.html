<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.3/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-semibold text-center text-gray-800 mb-8">Create an Account</h1>

        <form method="POST" action="/register">
            <div class="mb-4">
                <label for="username" class="block text-gray-700">Username</label>
                <input type="text" id="username" name="username" class="w-full p-3 mt-2 border rounded" required>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700">Password</label>
                <input type="password" id="password" name="password" class="w-full p-3 mt-2 border rounded" required>
            </div>
            <div class="mb-4">
                <button type="submit" class="w-full py-3 bg-blue-500 text-white rounded">Register</button>
            </div>
        </form>

        <p class="text-center mt-4">
            Already have an account? <a href="/login" class="text-blue-500">Login here</a>.
        </p>
    </div>
</body>
</html>
