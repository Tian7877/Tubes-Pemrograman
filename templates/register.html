<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.3/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>

        .slide-in-left {
            transform: translateX(-100%);
            transition: transform 0.5s ease-in-out;
        }

        .slide-in-right {
            transform: translateX(100%);
            transition: transform 0.5s ease-in-out;
        }

        .slide-out-left {
            transform: translateX(-100%);
            transition: transform 0.5s ease-in-out;
        }

        .slide-out-right {
            transform: translateX(100%);
            transition: transform 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-r from-blue-500 to-indigo-600 flex items-center justify-center min-h-screen">
    
    <div id="container" class="w-full max-w-4xl bg-white rounded-xl shadow-xl p-8 flex items-center space-x-8">
         <div class="hidden lg:block w-1/2">
            <div class="w-128 h-128 overflow-hidden rounded-full">
                <img src="https://img2.pngdownload.id/20180518/vzr/kisspng-weather-forecasting-logo-weather-5afeb3a37c07a6.529006401526641571508.jpg"
                     alt="Register Image" 
                     class="w-full h-full object-cover">
            </div>
        </div>

        <div class="w-full max-w-md space-y-6">
            <h2 class="text-3xl font-bold text-center text-gray-800">Join Us!</h2>
            <p class="text-center text-gray-600">Create your account</p>
            
            <form action="/register" method="POST" class="space-y-4">
                <div>
                    <label for="username" class="block text-gray-700 font-medium">Username</label>
                    <input type="text" id="username" name="username" required class="w-full px-4 py-3 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"  placeholder="Enter your username">
                </div>
                
                <div class="relative">
                    <label for="password" class="block text-gray-700 font-medium">Password</label>
                    <input type="password" id="password" name="password" required class="w-full px-4 py-3 mt-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Enter your password">
                    <button type="button" id="toggle-password" class="absolute mt-8 inset-y-0 right-3 flex items-center text-gray-600 focus:outline-none">
                        <i id="eye-icon" class="fas fa-eye"></i>
                    </button>
                </div>
                
                <button type="submit" class="w-full bg-blue-500 text-white py-3 rounded-lg font-semibold hover:bg-blue-600 transition duration-300">
                    Register
                </button>
            </form>

            <p class="text-center text-gray-600 mt-4">
                Already have an account? <a href="/login" class="text-blue-500 font-medium hover:text-blue-600 transition duration-300" id="login-link">Login here</a>.
            </p>
        </div>
    </div>

    <script>
        const togglePassword = document.getElementById('toggle-password');
        const passwordField = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');
        
        togglePassword.addEventListener('click', () => {
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });
        
        const container = document.getElementById('container');
        const loginLink = document.getElementById('login-link');
        loginLink.addEventListener('click', (e) => {
            e.preventDefault();
            container.classList.add('slide-out-right');
            setTimeout(() => {
                window.location.href = '/login';
            }, 500);
        });
    </script>
</body>
</html>
