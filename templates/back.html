<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Failed</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.3/dist/tailwind.min.css"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.3/dist/tailwind.min.css">
</head>
<body class="bg-gradient-to-r from-red-200 to-yellow-200 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white shadow-xl rounded-lg p-8 max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-semibold text-red-600">Oops! Login Failed</h1>
            <p class="text-lg text-gray-600 mt-2">The credentials you entered are incorrect. Please try again or register a new account.</p>
        </div>

    
        <div class="text-center mt-8">
            <a href="/register" class="bg-blue-500 text-white py-3 px-8 rounded-full hover:bg-blue-600 transition-all duration-300 transform hover:scale-105 mb-4 inline-block">Register</a>
            <br>
            <a href="/login" class="text-blue-500 text-lg hover:underline hover:text-blue-600 transition duration-300">Back to Login</a>
        </div>
    </div>
</body>
</html>
