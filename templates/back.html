<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Failed</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.3/dist/tailwind.min.css"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.3/dist/tailwind.min.css">

</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <!-- Card Container -->
    <div class="bg-white shadow-lg rounded-lg p-6 max-w-sm w-full">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-red-600">Login Failed</h1>
            <p class="text-gray-500">The credentials you entered are incorrect. Please try again or register.</p>
        </div>

        <!-- Register & Login Link -->
        <div class="text-center mt-6">
            <a href="/register" class="bg-blue-500 text-white py-2 px-6 rounded-full hover:bg-blue-600 transition duration-300 mb-4 inline-block">Register</a>
            <br>
            <a href="/login" class="text-blue-500 hover:underline">Back to Login</a>
        </div>

    </div>

</body>
</html>
